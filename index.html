<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>指数监控台</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;font-family:'SF Mono',Consolas,'Microsoft YaHei',monospace}
nav{position:sticky;top:0;z-index:99;display:flex;gap:8px;align-items:center;
    padding:10px 16px;background:#0d1117ee;backdrop-filter:blur(8px);
    border-bottom:1px solid #21262d}
nav .logo{color:#8b949e;font-size:13px;margin-right:8px}
nav button{background:#161b22;color:#8b949e;border:1px solid #30363d;
    padding:6px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit}
nav button:hover{color:#c9d1d9;border-color:#8b949e}
nav button.active{background:#1f6feb;color:#fff;border-color:#1f6feb}
.frame{display:none;width:100%;height:calc(100vh - 49px);border:0;background:#fff}
.frame.show{display:block}
</style></head><body>
<nav>
  <span class="logo">📊 指数监控台</span>
  <button id="tab-six-worth" onclick="show('six-worth')">六值指数</button>
  <button id="tab-drawdown" onclick="show('drawdown')">历史最大回撤</button>
  <button id="tab-trades" onclick="show('trades')">买卖点</button>
</nav>
<iframe id="frame-six-worth" class="frame show" src="six-worth-chart.html"></iframe>
<iframe id="frame-drawdown" class="frame" src="drawdown-monitor.html"></iframe>
<iframe id="frame-trades" class="frame" src="trades-dashboard.html"></iframe>
<script>
var PAGES = [{"key":"six-worth","name":"六值指数"},{"key":"drawdown","name":"历史最大回撤"},{"key":"trades","name":"买卖点"}];
function show(k){
  PAGES.forEach(function(p){
    document.getElementById('frame-' + p.key).classList.toggle('show', p.key === k);
    document.getElementById('tab-' + p.key).classList.toggle('active', p.key === k);
  });
  location.hash = k;
  try{ localStorage.setItem('activeTab', k) }catch(e){}
}
var h = location.hash.replace('#', '');
var saved = localStorage.getItem('activeTab');
var keys = PAGES.map(function(p){ return p.key; });
show(keys.indexOf(h) >= 0 ? h : (keys.indexOf(saved) >= 0 ? saved : keys[0]));
</script></body></html>
