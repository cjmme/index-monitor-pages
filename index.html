<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>指数监控台</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;font-family:'SF Mono',Consolas,'Microsoft YaHei',monospace}
nav{position:sticky;top:0;z-index:99;display:flex;gap:8px;align-items:center;
    padding:10px 16px;background:#0d1117ee;backdrop-filter:blur(8px);
    border-bottom:1px solid #21262d}
nav .logo{color:#8b949e;font-size:13px;margin-right:8px}
nav button{background:#161b22;color:#8b949e;border:1px solid #30363d;
    padding:6px 18px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit}
nav button:hover{color:#c9d1d9;border-color:#8b949e}
nav button.active{background:#1f6feb;color:#fff;border-color:#1f6feb}
.frame{display:none;width:100%;height:calc(100vh - 49px);border:0}
.frame.show{display:block}
</style></head><body>
<nav>
  <span class="logo">📊 指数监控台</span>
  <button id="tab-a" onclick="show('a')">六值指数</button>
  <button id="tab-b" onclick="show('b')">历史最大回撤</button>
</nav>
<iframe id="frame-a" class="frame show" src="six-worth-chart.html"></iframe>
<iframe id="frame-b" class="frame" src="drawdown-monitor.html"></iframe>
<script>
function show(which){
  document.getElementById('frame-a').classList.toggle('show', which==='a');
  document.getElementById('frame-b').classList.toggle('show', which==='b');
  document.getElementById('tab-a').classList.toggle('active', which==='a');
  document.getElementById('tab-b').classList.toggle('active', which==='b');
  location.hash = which==='a' ? 'chart' : 'drawdown';
  try{ localStorage.setItem('activeTab', which) }catch(e){}
}
var h = location.hash;
show(h.indexOf('drawdown')>=0 ? 'b' :
     (h.indexOf('chart')>=0 ? 'a' :
      (localStorage.getItem('activeTab') || 'a')));
</script></body></html>
