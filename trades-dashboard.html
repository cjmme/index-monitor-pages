          var y = String(v).slice(0,4);

          prevYear[y] = 1; return true;
        },
        formatter:function(v){ return String(v).slice(0,4); }},
      splitLine:{show:false}},
    yAxis:{type:'value', scale:true,
      axisLine:{lineStyle:{color:'#8c959f'}},
      axisLabel:{color:'#57606a', fontSize:10},
      splitLine:{lineStyle:{color:'#eaeef2'}}},
    dataZoom:[{type:'inside'}],
    series:[
      {name:'收盘', type:'line', data:d.closes, showSymbol:false,
       lineStyle:{width:1.1, color:'#1f6feb'},
       markLine:ml, markArea:ma, markPoint:{data:marks}},
      {id:'trades', name:'买卖点', type:'scatter',
       data: showTrades ? (filterMode === 'all' ? pts : pts.filter(function(p){return p.note === filterMode;})) : [],
       symbolSize:9, z:5,
       itemStyle:{borderColor:'#fff', borderWidth:1},
       tooltip:{trigger:'item', formatter:function(p){
         var t = p.data;
         var s = t.tdate + ' ' + t.kind + ' @ ' + t.tpoint;
         if (t.product) s += '<br/>产品：' + t.product;
         if (t.note) s += '<br/>备注：' + t.note;
         if (t.qty && t.qty > 1) s += '<br/>份数：' + t.qty;
         return s;
       }}}
    ]
  };
  chart.setOption(opt, true);
  updateBand();                         // 右侧留白带：绿色框 + 支撑位文字（按 y 轴换算像素）
  var w = document.getElementById('warn');
  if (d.warnings && d.warnings.length){
    w.style.display='block';
    w.innerHTML = '⚠ ' + d.warnings.join('<br/>⚠ ');
  } else { w.style.display='none'; }
  document.getElementById('meta').textContent =
    '数据日期 ' + d.updated + '　|　' + d.dates.length + ' 个交易日' +
    (d.box ? '　|　最新收盘 ' + d.box.close + '，距 ' + d.box.label +
             ' 的幅度 ' + d.box.text : '') + '　|　滚轮可缩放';
}

// 右侧留白带：每条点位线在右端标自己的名称(按 y 排序、相邻自动错开)，
// 主位额外把绿色幅度框叠在其标签正上方。全部在绘图区外，不压行情；
// 缩放/窗口变化时按 y 轴重新换算像素。不可见的线也 push 空元素，避免旧图元残留。
function updateBand(){
  var d = DATA[cur];
  var x = chart.getWidth() - GR + 6;
  var yTop = 48, yBot = chart.getHeight() - 46;
  var els = [], items = [];
  (d.levels || []).forEach(function(l, i){
    var py = chart.convertToPixel({yAxisIndex:0}, l.value);
    var visible = (py != null && !isNaN(py) && py >= yTop - 10 && py <= yBot + 10);
    items.push({i:i, py: visible ? py : yTop, label: visible ? l.label : '',
                color:l.color, visible:visible,
                main: !!(d.box && d.box.value === l.value)});
  });
  items.sort(function(a, b){ return a.py - b.py; });
  var lastTop = -999, mainTop = null;
  items.forEach(function(it){
    if (!it.visible){
      els.push({id:'lv' + it.i, type:'text', left:x, top:yTop, silent:true,
        style:{text:'', fill:it.color, font:'10px sans-serif'}});
      return;
    }
    var top = Math.max(it.py - 6, lastTop + 17);
    if (it.main) top = Math.max(top, lastTop + 40);   // 主位上方留 26px 给绿框
    top = Math.min(top, yBot - 12);
    lastTop = top;
    if (it.main) mainTop = top;
    els.push({id:'lv' + it.i, type:'text', left:x, top:top, silent:true,
      style:{text:it.label, fill:labelInk(it.color),
             font:'bold 10px Consolas,"Microsoft YaHei",monospace'}});
  });
  if (d.box && mainTop != null){
    var boxTop = Math.max(yTop + 2, mainTop - 26);
    els.push({id:'boxrect', type:'rect', left:x, top:boxTop, silent:true,
      shape:{width:60, height:22, r:3}, style:{fill:'#2da44e'}});
    els.push({id:'boxtxt', type:'text', left:x + 8, top:boxTop + 3, silent:true,
      style:{text:d.box.text, fill:'#fff', font:'bold 12px Consolas,monospace'}});
  } else {
    els.push({id:'boxrect', type:'rect', left:x, top:yTop, silent:true,
      shape:{width:0, height:0}, style:{fill:'transparent'}});
    els.push({id:'boxtxt', type:'text', left:x, top:yTop, silent:true,
      style:{text:'', fill:'transparent', font:'10px sans-serif'}});
  }
  chart.setOption({graphic:els});
}

var box = document.getElementById('symlist');
ids.forEach(function(id){
  var b = document.createElement('button');
  b.textContent = DATA[id].name;
  b.onclick = function(){
    cur = id;
    Array.prototype.forEach.call(box.children, function(x){ x.className=''; });
    b.className = 'on';
    render(id);
  };
  if (id === cur) b.className = 'on';
  box.appendChild(b);
});
render(cur);
chart.on('datazoom', updateBand);
window.addEventListener('resize', function(){ chart.resize(); updateBand(); });
</script></body></html>
